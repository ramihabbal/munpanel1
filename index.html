<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HHHSMUN Conference Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="uploadLoading" class="upload-loading hidden" aria-hidden="true">
  <div class="upload-loading-card" role="status" aria-live="polite">
    <div class="upload-spinner"></div>
    <strong id="uploadLoadingTitle">Uploading…</strong>
    <span id="uploadLoadingText">Please wait while the file is uploaded.</span>
  </div>
</div>
  <div id="loginView" class="login-shell">
    <div class="login-card">
      <img src="hhhsmu-logo.png" class="login-logo" alt="HHHSMUN">
      <div class="eyebrow">CONFERENCE MANAGEMENT SYSTEM</div>
      <div class="language-wrap login-language-visible"><span id="loginLanguageLabel">Language / Langue / اللغة</span><select id="loginLanguageSelect" onchange="setHHHLang(this.value)" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div>
      <h1>Administration sign in</h1>

      <label>Role</label>
      <select id="accountType">
        <option value="president">President</option>
        <option value="deputy">Deputy President</option>
        <option value="sg">Secretary-General</option>
        <option value="logistics">Head of Logistics</option>
        <option value="finance">Head of Finance</option>
        <option value="training">Head of Training</option>
        <option value="rapporteur">Head of Rapporteurs</option>
        <option value="advisory">Advisory Panel</option>
        <option value="chair">Chair</option>
        <option value="delegate">Delegate</option>
      </select>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><img src="hhhsmu-logo.png" alt="HHHSMUN"></div>
      <div class="role-chip" id="roleChip"></div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="conference-mini"><span>HHHSMUN</span><small>Conference Control</small></div>
        <button class="logout" onclick="logout()">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="breadcrumb">HHHSMUN / <span id="pageName">Overview</span></div><h2 id="pageTitle">Conference overview</h2></div><div class="user-menu"><div class="language-wrap app-language-visible"><span id="appLanguageLabel">Language / Langue / اللغة</span><select id="languageSelect" onchange="setHHHLang(this.value)" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div><span id="remoteStatus" class="remote-status">Connecting shared storage…</span><span class="avatar" id="avatar"></span><span id="userName"></span></div></header>
      <section id="content" class="content"></section>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pmpczworpdlhdwykddso.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_cTvTsx2PBQRZ_7qhPCBvuQ_ayEun0nF";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let remoteReady=false;
let remoteSaveTimer=null;
let remoteError="";
let lastRemoteTimerSync=0;

async function pullRemoteState(){
  try{
    const {data,error}=await supabaseClient.from("conference_state").select("data").eq("id","main").maybeSingle();
    if(error) throw error;
    remoteReady=true; remoteError="";
    if(data?.data && Object.keys(data.data).length){
      state.data={...structuredClone(defaults),...data.data};
      saveLocalOnly(); render();
    } else {
      await pushRemoteState();
    }
  }catch(e){
    remoteReady=false; remoteError=e?.message||String(e);
    console.error("Supabase connection failed:",e);
    renderRemoteStatus();
  }
}
async function ensureRemoteReady(){
  if(remoteReady)return true;
  try{
    const {error}=await supabaseClient.from("conference_state").select("id").eq("id","main").maybeSingle();
    if(error)throw error;
    remoteReady=true; remoteError=""; return true;
  }catch(e){
    remoteReady=false; remoteError=e?.message||String(e);
    alert("Shared storage is not connected yet. Supabase said: "+remoteError+"\n\nRun SUPABASE_SETUP.sql in Supabase SQL Editor, then reload the site.");
    return false;
  }
}
function renderRemoteStatus(){
  const el=document.getElementById("remoteStatus");
  if(el) el.textContent=remoteReady?"Shared storage connected":"Shared storage not connected";
}
function saveLocalOnly(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data))}catch(e){}}
async function pushRemoteState(){
  if(!remoteReady)return;
  try{await supabaseClient.from("conference_state").upsert({id:"main",data:state.data,updated_at:new Date().toISOString()},{onConflict:"id"});}
  catch(e){console.warn("Remote save failed",e)}
}
function scheduleRemoteSave(){
  clearTimeout(remoteSaveTimer);
  remoteSaveTimer=setTimeout(pushRemoteState,250);
}
const STORAGE_KEY="hhhsmUN_official_v2";
const defaults={
  committees:[],countries:[],staff:[],delegates:[],resolutions:[],resources:[],grades:[],logisticsRequests:[],notifications:[],screen:{committeeId:"",speaker:"",topic:"",mode:"",timer:"",timerSeconds:0,timerRunning:false,updated:0}
};
const loginPasswords={
  president:"Copper!Lantern27",
  deputy:"Marble#Orbit41",
  sg:"Cedar!Atlas58",
  logistics:"Harbor@Quartz63",
  finance:"Maple#Signal74",
  training:"Raven!Bridge26",
  rapporteur:"Pine@Vector85",
  advisory:"Summit@Advisory52",
  chair:"Orbit#Cedar39",
  delegate:"Lunar!Maple62"
};
window.roles={
  president:{label:"President",name:"President",avatar:"P",pages:[["overview","Overview"],["committees","Committees"],["countries","Countries"],["staff","Staff & Dais"],["delegates","Delegates"],["resolutions","Resolution Papers"],["grading","Grading"],["screen","Chairing Screen"],["resources","Resources"],["logisticsRequests","Logistics Requests"]]},
  deputy:{label:"Deputy President",name:"Deputy President",avatar:"DP",pages:[["overview","Overview"],["committees","Committees"],["countries","Countries"],["staff","Staff & Dais"],["delegates","Delegates"],["resolutions","Resolution Papers"],["grading","Grading"],["screen","Chairing Screen"],["resources","Resources"],["logisticsRequests","Logistics Requests"]]},
  sg:{label:"Secretary-General",name:"Secretary-General",avatar:"SG",pages:[["overview","Overview"],["committees","Committees"],["countries","Countries"],["staff","Staff & Dais"],["delegates","Delegates"],["resolutions","Resolution Papers"],["grading","Grading"],["screen","Chairing Screen"],["resources","Resources"],["logisticsRequests","Logistics Requests"]]},
  logistics:{label:"Head of Logistics",name:"Head of Logistics",avatar:"HL",pages:[["overview","Overview"],["committees","Committees"],["countries","Countries"],["staff","Staff & Dais"],["delegates","Delegates"],["resolutions","Resolution Papers"],["grading","Grading"],["screen","Chairing Screen"],["resources","Resources"],["logisticsRequests","Logistics Requests"],["settings","Settings"]]},
  finance:{label:"Head of Finance",name:"Head of Finance",avatar:"HF",pages:[["overview","Overview"],["finance","Finance"]]},
  training:{label:"Head of Training",name:"Head of Training",avatar:"HT",pages:[["overview","Overview"],["training","Training"],["resources","Resources"]]},
  rapporteur:{label:"Head of Rapporteurs",name:"Head of Rapporteurs",avatar:"HR",pages:[["overview","Overview"],["rapporteur","Rapporteurs"],["resources","Resources"]]},
  advisory:{label:"Advisory Panel",name:"Advisory Panel",avatar:"AP",pages:[["overview","Overview"],["committees","Committees"],["countries","Countries"],["staff","Staff & Dais"],["delegates","Delegates"],["resolutions","Resolution Papers"],["grading","Grading"],["screen","Chairing Screen"],["resources","Resources"],["logisticsRequests","Logistics Requests"]]},
  chair:{label:"Chair",name:"Chair",avatar:"C",pages:[["mycommittee","My Committee"],["screen","Chairing Screen"],["grading","Grading"],["resolutions","Resolution Papers"],["resources","Resources"],["logisticsRequests","Logistics Requests"]]},
  delegate:{label:"Delegate",name:"Delegate",avatar:"D",pages:[["delegatePortal","Delegate Portal"],["myResolutions","My Resolution Papers"],["resources","Resources"]]}
};
const passWords=["Cedar","Orbit","Maple","Harbor","Quartz","Atlas","Lantern","Signal","Raven","Vector","Summit","Comet","Pine","Marble","Copper","Lunar"];
function generateCommitteePassword(){const a=passWords[Math.floor(Math.random()*passWords.length)],b=passWords[Math.floor(Math.random()*passWords.length)],n=Math.floor(10+Math.random()*90);return `${a}!${b}${n}`;}
function loadData(){try{const d={...defaults,...JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")} ;d.committees=(d.committees||[]).map(c=>({...c,gradingPassword:c.gradingPassword||generateCommitteePassword()}));return d}catch{return structuredClone(defaults)}}
const state={role:null,page:"overview",data:loadData(),gradingCommittee:""};
setTimeout(pullRemoteState,0);
function save(){saveLocalOnly();scheduleRemoteSave();}
const FILE_DB="hhhsmUN_resolution_files";
function openFileDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(FILE_DB,2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files");if(!db.objectStoreNames.contains("resources"))db.createObjectStore("resources")};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function storeResourceFile(id,file){
  if(!(await ensureRemoteReady())) throw new Error(remoteError||"Supabase is not connected");
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=`resources/${id}-${safeName}`;
  const {error}=await supabaseClient.storage.from("conference-files").upload(path,file,{upsert:true,contentType:file.type||undefined});
  if(error)throw error;
  return path;
};
function login(){
 const type=document.getElementById("accountType").value,pass=document.getElementById("password").value;
 if(pass!==loginPasswords[type]){document.getElementById("loginError").textContent="Incorrect password.";return}
 state.role=type;state.page=window.roles[type].pages[0][0];document.getElementById("loginError").textContent="";document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");renderShell();render();if(state.page==="delegatePortal")populateDelegateSubmitters();
}
function logout(){state.role=null;document.getElementById("appView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");document.getElementById("password").value=""}
function renderShell(){const r=window.roles[state.role];document.getElementById("roleChip").textContent=r.label;document.getElementById("userName").textContent=r.name;document.getElementById("avatar").textContent=r.avatar;document.getElementById("nav").innerHTML=r.pages.map(p=>`<button class="nav-item ${state.page===p[0]?'active':''}" onclick="go('${p[0]}')"><span>${icon(p[0])}</span>${p[1]}</button>`).join("")}
function icon(p){return ({overview:"⌂",committees:"▦",countries:"◎",staff:"♜",delegates:"♙",resolutions:"§",grading:"★",screen:"◉",mycommittee:"▦",delegatePortal:"§",myResolutions:"▤",finance:"$",training:"T",rapporteur:"R",resources:"▤",logisticsRequests:"!",settings:"⚙"})[p]||"•"}
function go(p){
  if(!Object.prototype.hasOwnProperty.call(pages,p)){console.error("Unknown page:",p);return;}
  state.page=p;
  renderShell();
  render();
}
function render(){const titles={overview:["Overview","Conference overview"],committees:["Committees","Committee management"],countries:["Countries","Country registry"],staff:["Staff & Dais","Presidents, deputies, chairs and conference staff"],delegates:["Delegates","Delegate assignments"],resolutions:["Resolution Papers","Main and co-submitter workflow"],grading:["Grading","Committee grading system"],screen:["Chairing Screen","Live chairing panel display"],mycommittee:["My Committee","Committee control panel"],delegatePortal:["Delegate Portal","Delegate resolution paper submission"],myResolutions:["My Resolution Papers","Submitted resolution papers"],finance:["Finance","Finance department"],training:["Training","Training department"],rapporteur:["Rapporteurs","Rapporteur department"],resources:["Conference Resources","Background guides and conference files"],logisticsRequests:["Logistics Requests","Committee supply requests and notifications"],settings:["Data & settings","Local conference data"]};const t=titles[state.page]||titles.overview;document.getElementById("pageName").textContent=t[0];document.getElementById("pageTitle").textContent=t[1];const pageRenderer=Object.prototype.hasOwnProperty.call(pages,state.page)?pages[state.page]:pages.overview;try{document.getElementById("content").innerHTML=pageRenderer();}catch(err){console.error("Page render failed:",state.page,err);document.getElementById("content").innerHTML=`<div class="panel"><div class="panel-head"><div><h3>Page error</h3><p>The ${esc(t[0])} page could not be rendered.</p></div></div><pre style="white-space:pre-wrap;color:#b91c1c">${esc(err?.message||String(err))}</pre></div>`;}renderRemoteStatus();if(state.page==="delegatePortal"){populateDelegateSubmitters();const dc=document.getElementById("dpCom");if(dc)dc.onchange=populateDelegateSubmitters}}
function empty(title,text){return `<div class="empty-state"><strong>${title}</strong><p>${text}</p></div>`}
function modal(title,body){document.getElementById("modal")?.remove();document.body.insertAdjacentHTML("beforeend",`<div id="modal" class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="panel-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div></div></div>`)}
function closeModal(){document.getElementById("modal")?.remove()}
function formField(label,id,extra=""){return `<label class="form-label">${label}</label><input id="${id}" class="form-input" ${extra}>`}
function selectField(label,id,options){return `<label class="form-label">${label}</label><select id="${id}" class="form-input">${options}</select>`}
function metric(a,b,c){return `<div class="metric"><span>${a}</span><strong>${b}</strong><small>${c}</small></div>`}
function filterRows(q,id){q=q.toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none")}

// Core helpers used throughout the platform. Keep these global because page templates
// are evaluated from inline handlers and template literals.
const roles=window.roles;
function esc(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function committee(id){return state.data.committees.find(c=>c.id===id);}
function isStaff(){return ["president","deputy","sg","logistics","finance","training","rapporteur","advisory","chair"].includes(state.role);}
function canManage(){return ["president","deputy","sg","logistics","advisory"].includes(state.role);}

const pages={
 overview:()=>`<div class="permission-banner"><div><strong>${state.role==="advisory"?"Advisory Panel — full conference access":"Conference management"}</strong><p>${state.role==="advisory"?"The Advisory Panel can access conference-wide committees, countries, staff, delegates, resolutions, grading, screens, resources, finance, training, rapporteurs and logistics.":"Use the navigation to manage your assigned conference functions."}</p></div><span>${state.role==="advisory"?"FULL ACCESS":"HHHSMUN"}</span></div><div class="metric-grid">${metric("Committees",state.data.committees.length,"Configured by your team")}${metric("Countries",state.data.countries.length,"Registered")}${metric("Delegates",state.data.delegates.length,"Registered")}${metric("Resolution papers",state.data.resolutions.length,"Submitted")}</div><div class="two-col"><div class="panel"><div class="panel-head"><div><h3>Conference structure</h3><p>Every committee is created and controlled here.</p></div><button class="text-btn" onclick="go('committees')">Manage →</button></div>${state.data.committees.length?`<div class="committee-list">${state.data.committees.map(c=>`<div class="committee-row"><div><strong>${esc(c.name)}</strong><small>${esc(c.fullName||"")}${c.room?" · "+esc(c.room):""}</small></div><span>${state.data.delegates.filter(d=>d.committee===c.id).length}</span><span class="status in-session">Configured</span></div>`).join("")}</div>`:empty("No committees yet","Create your committees from the Committees tab.")}</div><div class="panel"><div class="panel-head"><div><h3>Logistics requests</h3><p>Submit materials needed by any committee and send the request directly to Head of Logistics.</p></div><button class="primary" onclick="go('logisticsRequests')">Open logistics →</button></div></div><div class="panel"><div class="panel-head"><div><h3>Resolution workflow</h3><p>Delegate submissions are routed to the SG and chairing panel.</p></div></div><div class="ranking"><div class="rank"><b>1</b><span><strong>Draft</strong><small>Delegate selects main and co-submitters</small></span><strong>→</strong></div><div class="rank"><b>2</b><span><strong>SG review</strong><small>Secretary-General receives the paper</small></span><strong>→</strong></div><div class="rank"><b>3</b><span><strong>Chairing panel</strong><small>Chair can review and send it to the screen</small></span><strong>→</strong></div></div></div></div>`,
 committees:()=>`<div class="toolbar"><div class="search">⌕ <input oninput="filterRows(this.value,'committeeTable')" placeholder="Search committees..."></div>${canManage()?`<button class="primary" onclick="openCommittee()">+ Add committee</button>`:""}</div><div class="panel setup-note"><strong>Unlimited custom committees</strong><p>Create any committee you want. Each committee automatically gets its own President, Deputy President and Chair assignment area, a grading password, a resolution queue and a chairing screen.</p></div><div class="panel table-panel"><table id="committeeTable"><thead><tr><th>Committee</th><th>Full name</th><th>Room</th><th>Type</th><th>Dais</th><th>Grading</th><th></th></tr></thead><tbody>${state.data.committees.map(c=>{const dais=state.data.staff.filter(s=>s.committee===c.id);return `<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.fullName||"")}</td><td>${esc(c.room||"—")}</td><td>${esc(c.type||"—")}</td><td>${dais.filter(s=>["President","Deputy President","Chair"].includes(s.role)).length}/3</td><td><span class="access">Password assigned</span></td><td><button class="row-btn" onclick="openCommitteePanel('${c.id}')">Open panel</button> ${canManage()?`<button class="row-btn" onclick="openCommittee('${c.id}')">Edit</button> <button class="row-btn danger" onclick="removeRecord('committees','${c.id}')">Delete</button>`:""}</td></tr>`}).join("")}</tbody></table>${!state.data.committees.length?empty("No committees","Use “Add committee” to create the conference structure."):""}</div>`,
 countries:()=>countriesPanel(),
 staff:()=>`<div class="toolbar"><div class="search">⌕ <input oninput="filterRows(this.value,'staffTable')" placeholder="Search staff..."></div>${canManage()?`<button class="primary" onclick="openStaff()">+ Add staff member</button>`:""}</div><div class="panel table-panel"><table id="staffTable"><thead><tr><th>Name</th><th>Role</th><th>Committee</th><th></th></tr></thead><tbody>${state.data.staff.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td><span class="role-badge">${esc(s.role)}</span></td><td>${esc(committee(s.committee)?.name||"Conference-wide")}</td><td>${canManage()?`<button class="row-btn" onclick="openStaff('${s.id}')">Edit</button> <button class="row-btn danger" onclick="removeRecord('staff','${s.id}')">Delete</button>`:""}</td></tr>`).join("")}</tbody></table>${!state.data.staff.length?empty("No staff added","Add the President, Deputy President, Chairs and conference heads."):""}</div><div class="settings-grid"><div class="setting"><label>Conference leadership</label><strong>President · Deputy President</strong><p>Conference-wide leadership roles retained from the original system.</p></div><div class="setting"><label>Operational heads</label><strong>Logistics · Finance · Training · Rapporteurs</strong><p>Separate management areas are available for each department.</p></div></div>`,
 delegates:()=>`<div class="toolbar"><div class="search">⌕ <input oninput="filterRows(this.value,'delegateTable')" placeholder="Search delegates..."></div>${canManage()?`<button class="primary" onclick="openDelegate()">+ Add delegate</button>`:""}</div><div class="panel table-panel"><table id="delegateTable"><thead><tr><th>Name</th><th>Country</th><th>Committee</th><th></th></tr></thead><tbody>${state.data.delegates.map(d=>`<tr><td><strong>${esc(d.name)}</strong></td><td>${esc(state.data.countries.find(c=>c.id===d.country)?.name||"")}</td><td>${esc(committee(d.committee)?.name||"")}</td><td>${canManage()?`<button class="row-btn" onclick="openDelegate('${d.id}')">Edit</button> <button class="row-btn danger" onclick="removeRecord('delegates','${d.id}')">Delete</button>`:""}</td></tr>`).join("")}</tbody></table>${!state.data.delegates.length?empty("No delegates","Add delegates after creating committees and countries."):""}</div>`,
 resolutions:()=>{const incoming=state.data.resolutions.filter(r=>r.status!=="Archived");return `<div class="permission-banner"><div><strong>Resolution paper workflow</strong><p>Delegates submit papers with one or more main submitters and co-submitters. The paper becomes visible to the Secretary-General and the assigned chairing panel for review.</p></div><span>DELEGATE → SG → CHAIRING PANEL</span></div><div class="toolbar"><div class="search">⌕ <input oninput="filterRows(this.value,'resolutionTable')" placeholder="Search papers, committees or submitters..."></div></div><div class="panel table-panel"><table id="resolutionTable"><thead><tr><th>Paper</th><th>Committee</th><th>Main submitters</th><th>Co-submitters</th><th>Status</th><th>Actions</th></tr></thead><tbody>${incoming.map(r=>`<tr><td><strong>${esc(r.title)}</strong><small>${r.fileName?`<button class="text-btn" onclick="downloadResolutionFile('${r.id}')">${esc(r.fileName)}</button>`:esc(r.clauses||"")}</small></td><td>${esc(committee(r.committee)?.name||"")}</td><td>${(r.main||[]).map(esc).join(", ")||"—"}</td><td>${(r.co||[]).map(esc).join(", ")||"—"}</td><td><span class="status ${r.status.toLowerCase().replaceAll(" ","-")}">${esc(r.status)}</span></td><td>${["president","deputy","sg","rapporteur","chair"].includes(state.role)?`<button class="row-btn" onclick="openResolution('${r.id}')">Review</button>`:""}</td></tr>`).join("")}</tbody></table>${!incoming.length?empty("No resolution papers","Submitted papers will appear here."):""}</div>`},
 grading:()=>`<div class="grading-summary"><div><span class="eyebrow">COMMITTEE-GATED GRADING</span><h3>Enter a committee grading room</h3><p>Use the private grading password provided to your committee.</p></div></div>${state.gradingCommittee?gradingRoom():`<div class="panel"><div class="modal-body">${selectField("Committee","gradeCom",`<option value="">Select committee</option>`+state.data.committees.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""))}${formField("Committee grading password","gradePass",`type="password" placeholder="Enter private password" autocomplete="off"`)}<button class="primary full" onclick="enterGrading()">Enter grading system</button></div></div>`}`,
 screen:()=>screenPage(),
 mycommittee:()=>{const mine=state.data.staff.find(s=>s.role==="Chair"&&s.name===window.roles.chair.name)||state.data.staff.find(s=>s.role==="Chair");return mine?committeePanel(mine.committee):empty("No committee assigned","Your Chair account has not been assigned to a committee yet.")},
  delegatePortal:()=>`<div class="permission-banner"><div><strong>Delegate resolution portal</strong><p>Upload your resolution paper as a PDF or Word document. Select the main submitters and co-submitters. The paper is routed to the Secretary-General and assigned chairing panel.</p></div><span>UPLOAD → SG → CHAIR</span></div><div class="panel"><div class="panel-head"><div><h3>New resolution paper</h3><p>Accepted formats: PDF, DOC, DOCX · Maximum size: 20 MB.</p></div></div><div class="modal-body">${formField("Resolution title","dpTitle",`placeholder="Draft resolution title"`)}${selectField("Committee","dpCom",`<option value="">Select committee</option>`+state.data.committees.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""))}<label class="form-label">Main submitters</label><select id="dpMain" class="form-input" multiple size="5"></select><label class="form-label">Co-submitters</label><select id="dpCo" class="form-input" multiple size="6"></select><label class="form-label">Resolution paper file</label><input id="dpFile" class="form-input file-input" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="showSelectedFile(this)"><div id="dpFileInfo" class="file-info">No file selected.</div><button class="primary full" onclick="submitDelegateResolution()">Upload and submit to SG and Chairing Panel</button></div></div>`,

function openCommittee(id=""){const x=committee(id)||{};modal(id?"Edit committee":"Add committee",`${formField("Committee abbreviation","fName",`value="${esc(x.name||"")}" placeholder="UNODC"`)}${formField("Official committee name","fFull",`value="${esc(x.fullName||"")}"`)}${formField("Room (optional)","fRoom",`value="${esc(x.room||"")}"`)}${formField("Committee type (optional)","fType",`value="${esc(x.type||"")}" placeholder="General Assembly, Crisis, Specialized..."`)}<label class="form-label">Description (optional)</label><textarea id="fDescription" class="form-input" rows="3" placeholder="Brief description">${esc(x.description||"")}</textarea><button class="primary full" onclick="saveCommittee('${id}')">Save committee</button>`)}
function saveCommittee(id){const name=document.getElementById("fName").value.trim(),fullName=document.getElementById("fFull").value.trim(),room=document.getElementById("fRoom").value.trim(),type=document.getElementById("fType").value.trim(),description=document.getElementById("fDescription").value.trim();if(!name)return alert("Committee abbreviation is required.");const duplicate=state.data.committees.find(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==id);if(duplicate)return alert("A committee with that abbreviation already exists.");const obj={id:id||uid(),name,fullName,room,type,description,gradingPassword:id?(committee(id)?.gradingPassword||generateCommitteePassword()):generateCommitteePassword()};const i=state.data.committees.findIndex(c=>c.id===id);i>=0?state.data.committees[i]=obj:state.data.committees.push(obj);save();closeModal();render()}
function openCountry(id=""){const x=state.data.countries.find(x=>x.id===id)||{committees:[]};modal(id?"Edit country":"Add country",`${formField("Country name","fCountry",`value="${esc(x.name||"")}"`)}<label class="form-label">Committees where this country is available</label><div class="check-grid">${state.data.committees.length?state.data.committees.map(c=>`<label><input type="checkbox" name="fCom" value="${c.id}" ${(x.committees||[]).includes(c.id)?"checked":""}> ${esc(c.name)}</label>`).join(""):"<span class='muted'>Create committees first.</span>"}</div><button class="primary full" onclick="saveCountry('${id}')">Save country</button>`)}
function saveCountry(id){const name=document.getElementById("fCountry").value.trim();if(!name)return alert("Country name is required.");const committees=[...document.querySelectorAll('input[name="fCom"]:checked')].map(x=>x.value),obj={id:id||uid(),name,committees};const i=state.data.countries.findIndex(x=>x.id===id);i>=0?state.data.countries[i]=obj:state.data.countries.push(obj);save();closeModal();render()}
function openStaff(id=""){const x=state.data.staff.find(x=>x.id===id)||{};const rolesList=["President","Deputy President","Secretary-General","Head of Logistics","Head of Finance","Head of Training","Head of Rapporteurs","Chair"];modal(id?"Edit staff member":"Add staff member",`${formField("Full name","fStaff",`value="${esc(x.name||"")}"`)}${selectField("Role","fRole",rolesList.map(r=>`<option ${x.role===r?"selected":""}>${r}</option>`).join(""))}${selectField("Committee","fStaffCom",`<option value="">Conference-wide</option>`+state.data.committees.map(c=>`<option value="${c.id}" ${x.committee===c.id?"selected":""}>${esc(c.name)}</option>`).join(""))}<button class="primary full" onclick="saveStaff('${id}')">Save staff member</button>`)}
function saveStaff(id){const name=document.getElementById("fStaff").value.trim(),role=document.getElementById("fRole").value,com=document.getElementById("fStaffCom").value;if(!name)return alert("Name is required.");if(["President","Deputy President","Secretary-General","Head of Logistics","Head of Finance","Head of Training","Head of Rapporteurs"].includes(role))com="";if(["President","Deputy President","Chair"].includes(role)&&com){const occupied=state.data.staff.find(s=>s.id!==id&&s.committee===com&&s.role===role);if(occupied)return alert(`This committee already has a ${role}.`)}const obj={id:id||uid(),name,role,committee:com};const i=state.data.staff.findIndex(x=>x.id===id);i>=0?state.data.staff[i]=obj:state.data.staff.push(obj);save();closeModal();render()}

function countriesPanel(){const selected=state.countryCommittee||state.data.committees[0]?.id||"";const c=committee(selected);const countries=state.data.countries.filter(x=>(x.committees||[]).includes(selected));return `<div class="toolbar"><div class="field-inline"><label>Committee</label><select class="committee-selector" onchange="state.countryCommittee=this.value;render()">${state.data.committees.map(x=>`<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>${canManage()?`<button class="primary" onclick="openCountry()">+ Add country</button>`:""}</div><div class="panel"><div class="panel-head"><div><h3>${esc(c?.name||"Countries")}</h3><p>Select the attendance status for each country. Changes save automatically.</p></div><span class="status in-session">${countries.length} countries</span></div><div class="country-list"><div class="country-attendance-head"><strong>Country</strong><strong>Attendance</strong></div>${countries.length?countries.map(country=>{const att=(country.attendance||{})[selected]||"";return `<div class="country-panel-row"><strong>${esc(country.name)}</strong><select class="attendance-select" onchange="setCountryAttendance('${country.id}','${selected}',this.value)"><option value="">Select attendance</option><option value="Present" ${att==="Present"?"selected":""}>Present</option><option value="Present and Voting" ${att==="Present and Voting"?"selected":""}>Present and Voting</option><option value="Absent" ${att==="Absent"?"selected":""}>Absent</option></select></div>`}).join(""):`<div class="empty-state"><strong>No countries assigned to this committee yet.</strong><p>Add countries through the committee management panel.</p></div>`}</div></div><div class="panel"><div class="panel-head"><div><h3>Attendance summary</h3><p>${esc(c?.name||"")}</p></div></div><div class="attendance-summary">${["Present","Present and Voting","Absent"].map(a=>{const n=countries.filter(x=>((x.attendance||{})[selected]||"")===a).length;return `<div class="attendance-pill"><strong>${n}</strong><span>${a}</span></div>`}).join("")}</div></div>`}
function openDelegate(id=""){const x=state.data.delegates.find(x=>x.id===id)||{};modal(id?"Edit delegate":"Add delegate",`${formField("Delegate name","fDel",`value="${esc(x.name||"")}"`)}${selectField("Committee","fDelCom",`<option value="">Select committee</option>`+state.data.committees.map(c=>`<option value="${c.id}" ${x.committee===c.id?"selected":""}>${esc(c.name)}</option>`).join(""))}${selectField("Country","fDelCountry",`<option value="">Select country</option>`+state.data.countries.map(c=>`<option value="${c.id}" ${x.country===c.id?"selected":""}>${esc(c.name)}</option>`).join(""))}<button class="primary full" onclick="saveDelegate('${id}')">Save delegate</button>`)}
function saveDelegate(id){const name=document.getElementById("fDel").value.trim(),committeeId=document.getElementById("fDelCom").value,country=document.getElementById("fDelCountry").value;if(!name||!committeeId||!country)return alert("Name, committee and country are required.");const allowed=state.data.countries.find(c=>c.id===country)?.committees||[];if(allowed.length&&!allowed.includes(committeeId))return alert("That country is not assigned to this committee.");const obj={id:id||uid(),name,committee:committeeId,country};const i=state.data.delegates.findIndex(x=>x.id===id);i>=0?state.data.delegates[i]=obj:state.data.delegates.push(obj);save();closeModal();render()}
function openCommitteePanel(id){const c=committee(id);if(!c)return;modal(`${esc(c.name)} · Committee Panel`,committeePanel(id))}
function committeePanel(id){const c=committee(id);if(!c)return empty("Committee not found","");const dais=state.data.staff.filter(s=>s.committee===id&&["President","Deputy President","Chair"].includes(s.role));const ds=state.data.delegates.filter(d=>d.committee===id);const assignedCountries=state.data.countries.filter(x=>(x.committees||[]).includes(id));return `<div class="committee-hero"><div><span class="eyebrow">${esc(c.name)}${c.room?" · "+esc(c.room):""}</span><h3>${esc(c.fullName||c.name)}</h3><p>${esc(c.description||"Committee management panel")}</p></div><span class="status in-session">${esc(c.type||"Committee")}</span></div><div class="metric-grid">${metric("President",dais.find(s=>s.role==="President")?.name||"Unassigned","Committee dais")}${metric("Deputy President",dais.find(s=>s.role==="Deputy President")?.name||"Unassigned","Committee dais")}${metric("Chair",dais.find(s=>s.role==="Chair")?.name||"Unassigned","Chairing panel")}${metric("Delegates",ds.length,"Assigned")}</div><div class="panel"><div class="panel-head"><div><h3>Committee Dais</h3><p>Assign people by name. Each Dais member is restricted to their assigned committee.</p></div></div><div class="settings-actions">${["President","Deputy President","Chair"].map(role=>`<button class="secondary" onclick="openDaisAssignment('${id}','${role}')">Assign ${role}</button>`).join("")}</div></div><div class="panel"><div class="panel-head"><div><h3>Countries & delegates</h3><p>Add one country per line. Optionally use <strong>Country | Delegate Name</strong> to create the delegate assignment at the same time.</p></div></div><div class="modal-body"><textarea id="bulkCountries" class="form-input" rows="8" placeholder="Lebanon | Rami Haddad

${assignedCountries.length?`<div class="attendance-head"><strong>Country</strong><strong>Delegate</strong><strong>Attendance</strong><strong>Action</strong></div>`:""}
${assignedCountries.map(country=>{const d=ds.find(d=>d.country===country.id);const att=(country.attendance||{})[id]||"";return `<div class="country-attendance-row">

function openDaisAssignment(committeeId,role){const current=state.data.staff.find(s=>s.committee===committeeId&&s.role===role);const names=state.data.staff.filter(s=>s.role===role&&(s.committee===committeeId||!s.committee));modal(`Assign ${role}`,`${formField("Full name","daisName",`value="${esc(current?.name||"")}" placeholder="Full name"`)}<p class="muted">This assignment only grants this Dais role access to the selected committee.</p><button class="primary full" onclick="saveDaisAssignment('${committeeId}','${role}','${current?.id||""}')">Save assignment</button>`) }
function saveDaisAssignment(committeeId,role,id){const name=document.getElementById("daisName").value.trim();if(!name)return alert("Name is required.");let existing=state.data.staff.find(s=>s.id===id)||state.data.staff.find(s=>s.committee===committeeId&&s.role===role);if(existing){existing.name=name;existing.committee=committeeId;existing.role=role}else state.data.staff.push({id:uid(),name,role,committee:committeeId});save();closeModal();openCommitteePanel(committeeId)}
function saveBulkCountries(committeeId){const lines=document.getElementById("bulkCountries").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return alert("Enter at least one country.");for(const line of lines){const parts=line.split("|").map(x=>x.trim());const countryName=parts[0],delegateName=parts[1]||"";if(!countryName)continue;let country=state.data.countries.find(c=>c.name.toLowerCase()===countryName.toLowerCase());if(!country){country={id:uid(),name:countryName,committees:[]};state.data.countries.push(country)}country.committees=country.committees||[];if(!country.committees.includes(committeeId))country.committees.push(committeeId);if(delegateName){let d=state.data.delegates.find(x=>x.committee===committeeId&&x.country===country.id);if(d)d.name=delegateName;else state.data.delegates.push({id:uid(),name:delegateName,committee:committeeId,country:country.id})}}save();closeModal();openCommitteePanel(committeeId)}
function setCountryAttendance(countryId,committeeId,value){const c=state.data.countries.find(x=>x.id===countryId);if(!c)return;c.attendance=c.attendance||{};if(value)c.attendance[committeeId]=value;else delete c.attendance[committeeId];save();}
function removeCountryFromCommittee(countryId,committeeId){const c=state.data.countries.find(x=>x.id===countryId);if(!c)return;if(!confirm("Remove this country from this committee?"))return;c.committees=(c.committees||[]).filter(x=>x!==committeeId);state.data.delegates=state.data.delegates.filter(d=>!(d.country===countryId&&d.committee===committeeId));save();openCommitteePanel(committeeId)}
function openLogisticsRequest(){
 const mine=state.data.staff.find(s=>s.role==="Chair"&&s.name===window.roles.chair.name);
 let committeeId=mine?.committee||"";
 const isPresident=state.role==="president";
 if(isPresident && !committeeId) committeeId="";
 if(state.role==="chair" && !committeeId)return alert("Your Chair account is not assigned to a committee.");
 if(!["chair","president"].includes(state.role))return alert("You do not have permission to submit a committee logistics request.");
 const items=[
  ["Scissors","reusable"],["Stapler","reusable"],["Cardboard","consumable"],["Sticky notes","consumable"],
  ["Markers","consumable"],["Colored paper","consumable"],["Printer paper","consumable"],["Tape","consumable"],
  ["Glue","consumable"],["String / ribbon","consumable"],["Folders","reusable"],["Name tags","consumable"]
 ];
 const rows=items.map((x,i)=>`<div class="logistics-item-row">
   <label><input type="checkbox" class="lrItemCheck" data-item="${esc(x[0])}" data-reusable="${x[1]==="reusable"}"> <strong>${esc(x[0])}</strong>${x[1]==="reusable"?` <span class="reusable-tag">Reusable</span>`:""}</label>
   <input class="form-input lrAmount" data-for="${i}" type="number" min="1" value="1" placeholder="Amount" disabled>
   <input class="form-input lrColor" data-for="${i}" placeholder="Colour (if applicable)" disabled>
 </div>`).join("");
 modal("Committee logistics request",`
   ${isPresident?`<label class="form-label">Committee</label><select id="lrCommittee" class="form-input">${state.data.committees.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.fullName||"")}</option>`).join("")}</select>`:`<div class="request-committee"><strong>${esc(committee(committeeId)?.name||"Your committee")}</strong><span>${esc(committee(committeeId)?.fullName||"")}</span></div>`}
   <p class="muted">Select everything your committee needs for decoration, setup, or session use. Enter an amount for every selected item. Add a colour when the material can have different colours.</p>
   <div class="logistics-items">${rows}</div>
   <div class="other-request">
     <label class="form-label"><input id="lrOtherCheck" type="checkbox"> Other</label>
     <input id="lrOtherItem" class="form-input" placeholder="Describe another material" disabled>
     <input id="lrOtherAmount" class="form-input" type="number" min="1" value="1" placeholder="Amount" disabled>
     <input id="lrOtherColor" class="form-input" placeholder="Colour (if applicable)" disabled>
     <label class="form-label"><input id="lrOtherReusable" type="checkbox"> Other item is reusable</label>
   </div>
   <div class="terms-box">
     <strong>Materials receipt, return and replacement terms</strong>
     <p>By accepting this request, I acknowledge that the committee is responsible for the materials issued to it. Reusable materials, including staplers, scissors, folders and other reusable equipment, must be returned to the Head of Logistics after use. If reusable materials are lost, damaged through misuse, or not returned, the responsible committee agrees to cover the replacement cost according to Secretariat policy.</p>
     <label><input id="lrAgree" type="checkbox"> I agree to these materials terms on behalf of my committee.</label>
   </div>
   <button class="primary full" onclick="saveLogisticsRequest()">Send request to Head of Logistics</button>
 `);
 document.querySelectorAll(".lrItemCheck").forEach((check,i)=>{
   check.addEventListener("change",()=>{
     document.querySelector(`.lrAmount[data-for="${i}"]`).disabled=!check.checked;
     document.querySelector(`.lrColor[data-for="${i}"]`).disabled=!check.checked;
   });
 });
 document.getElementById("lrOtherCheck").addEventListener("change",()=>{
   const on=document.getElementById("lrOtherCheck").checked;
   ["lrOtherItem","lrOtherAmount","lrOtherColor","lrOtherReusable"].forEach(id=>document.getElementById(id).disabled=!on);
 });

function saveLogisticsRequest(){

const HHH_LANG_KEY="hhhsmUN_language";let hhhLanguage=localStorage.getItem(HHH_LANG_KEY)||"en";const HHH_LANGS={en:"English",fr:"Français",ar:"العربية"};
const gradeRubrics={
en:[{name:"Opening Speech",max:20,criteria:[["Content",5],["Presents Proper Resolutions to the Topic",2],["Sticks to Country's Stance",3],["Tone & Body Language",3],["Time Respected",1],["Ability to Answer POIs",3],["Diplomacy & Communication",2],["Yielding of Time",1]]},{name:"Moderated Caucus",max:15,criteria:[["Content",5],["Presents Proper Resolutions to the Subtopic",1],["Sticks to Country's Stance",2],["Tone & Body Language",1],["Ability to Answer POIs",2],["Diplomacy & Communication",2],["Relevance & Development of Argument",2]]},{name:"Unmoderated Caucus",max:20,criteria:[["Participation & Contribution Within Bloc",4],["Relevance & Importance of Content",4],["Collaboration & Negotiation",4],["Proper Structure of Resolution",3],["Diplomacy & Communication",3],["Feasibility of Solutions",2]]},{name:"Resolution Presentation",max:20,criteria:[["Resolution Delivered in a Concise & Understandable Way",5],["Ability to Answer Points of Information",5],["Clarity & Knowledge of Resolution",4],["Tone & Body Language",3],["Diplomacy & Communication",3]]},{name:"With or Against Speech",max:5,criteria:[["Persuasive Content",3],["Tone & Body Language",2]]},{name:"Amendments",max:10,criteria:[["Presents Innovative Amendments",3],["Presents & Debates Unfriendly Amendment with a Clear Understanding",4],["Diplomacy & Communication",1],["Delegates Sends Reasonable & Feasible Amendments",2]]},{name:"Crisis",max:4,criteria:[["Shows Professionalism, Diplomacy, and Cooperation at All Times",2],["Presents Feasible & Creative Solutions to the Issue During Their Speech",1],["Good Tone, Presence, & Body Language While Presenting",1]]},{name:"Extras",max:6,criteria:[["Points & Motions Raised",6]]}],
fr:[{name:"Discours d'ouverture",max:20,criteria:[["Contenu",5],["Présente une résolution convenable à propos le thème",2],["Respecte la position de son pays",3],["Language corporel et ton",3],["Respecte le temps",1],["Capacité de répondre au point d'information",3],["Diplomatie et Communication",2],["Céde le temps",1]]},{name:"Caucus modéré",max:15,criteria:[["Contenu",5],["Présente une résolution convenable à propos du sous-thème",1],["Respecte la position de son pays",2],["Language corporel et ton",1],["Capacité de répondre au point d'information",2],["Diplomatie et Communication",2],["Pertinence et développement de l'argument",2]]},{name:"Caucus immodéré",max:20,criteria:[["Participation et Contribution au sein du bloc",4],["Pertinence et importance du contenu proposé",4],["Collaboration et négociation",4],["Structure propre de la résolution",3],["Diplomatie et Communication",3],["Faisabilité des solutions",2]]},{name:"Présentation des résolutions",max:20,criteria:[["Solution présentée de façon concise et compréhensible",5],["Capacité de répondre au point d'information",5],["Clarté et maîtrise de la résolution",4],["Language corporel et ton",3],["Diplomatie et Communication",3]]},{name:"Discours pour ou contre",max:5,criteria:[["Contenu persuasif",3],["Language corporel et ton",2]]},{name:"Amendments",max:10,criteria:[["Présente des amendements innovants",3],["Présente et débat les amendements hostiles avec une compréhension claire",4],["Diplomatie et Communication",1],["Envoi des amendments raisonnables et réalisables",2]]},{name:"Crise",max:4,criteria:[["Fait preuve de professionnalisme, de diplomatie et coopére à tout moment",2],["Présente des solutions réalisables et créatives au problème lors de son discours",1],["Good Tone, Presence, & Body Language While Presenting",1]]},{name:"Points supplémentaires",max:6,criteria:[["Points et motions soulevés",6]]}],

};
const uiT={fr:{"Overview":"Vue d'ensemble","Committees":"Comités","Countries":"Pays","Staff & Dais":"Personnel et présidence","Delegates":"Délégués","Resolution Papers":"Projets de résolution","Grading":"Évaluation","Chairing Screen":"Écran de présidence","Resources":"Ressources","Logistics Requests":"Demandes logistiques","Settings":"Paramètres","Finance":"Finance","Training":"Formation","Rapporteurs":"Rapporteurs","My Committee":"Mon comité","Delegate Portal":"Portail des délégués","My Resolution Papers":"Mes projets de résolution","Sign in":"Se connecter","Sign out":"Se déconnecter","Password":"Mot de passe","Role":"Rôle","Chair":"Président","President":"Président","Deputy President":"Vice-président","Secretary-General":"Secrétaire général","Head of Logistics":"Responsable de la logistique","Head of Training":"Responsable de la formation","Head of Rapporteurs":"Responsable des rapporteurs","Advisory Panel":"Conseil consultatif","Delegate":"Délégué","Search":"Rechercher","Save":"Enregistrer","Delete":"Supprimer"},ar:{"Overview":"نظرة عامة","Committees":"اللجان","Countries":"الدول","Staff & Dais":"الموظفون وهيئة الرئاسة","Delegates":"المندوبون","Resolution Papers":"مشاريع القرارات","Grading":"التقييم","Chairing Screen":"شاشة هيئة الرئاسة","Resources":"الموارد","Logistics Requests":"الطلبات اللوجستية","Settings":"الإعدادات","Finance":"المالية","Training":"التدريب","Rapporteurs":"المقررون","My Committee":"لجنتي","Delegate Portal":"بوابة المندوب","My Resolution Papers":"مشاريع قراراتي","Sign in":"تسجيل الدخول","Sign out":"تسجيل الخروج","Password":"كلمة المرور","Role":"الدور","Chair":"الرئيس","President":"الرئيس","Deputy President":"نائب الرئيس","Secretary-General":"الأمين العام","Head of Logistics":"رئيس اللوجستيات","Head of Training":"رئيس التدريب","Head of Rapporteurs":"رئيس المقررين","Advisory Panel":"المجلس الاستشاري","Delegate":"مندوب","Search":"بحث","Save":"حفظ","Delete":"حذف"}};
function langUI(id){const label=hhhLanguage==="fr"?"Langue":hhhLanguage==="ar"?"اللغة":"Language";return `<div class="language-wrap"><span>${label}</span><select id="${id}" onchange="setHHHLang(this.value)" aria-label="Language">${Object.entries(HHH_LANGS).map(([k,v])=>`<option value="${k}" ${k===hhhLanguage?"selected":""}>${v}</option>`).join("")}</select></div>`}
function applyHHHLang(){document.documentElement.lang=hhhLanguage;document.documentElement.dir=hhhLanguage==="ar"?"rtl":"ltr";if(hhhLanguage==="en")return;const d=uiT[hhhLanguage]||{};const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(n=>{const t=n.nodeValue.trim();if(d[t])n.nodeValue=n.nodeValue.replace(t,d[t])});}
function setHHHLang(v){hhhLanguage=HHH_LANGS[v]?v:"en";localStorage.setItem(HHH_LANG_KEY,hhhLanguage);if(state.role)renderShell();render();}
function addHHHLangUI(){const loginSelect=document.getElementById("loginLanguageSelect");if(loginSelect)loginSelect.value=hhhLanguage;const appSelect=document.getElementById("languageSelect");if(appSelect)appSelect.value=hhhLanguage;const l=document.querySelector("#loginView .login-card");if(l&&!loginSelect)l.insertAdjacentHTML("afterbegin",langUI("loginLanguageSelect"));const t=document.querySelector(".topbar .user-menu");if(t&&!appSelect)t.insertAdjacentHTML("afterbegin",langUI("languageSelect"));const ls=document.getElementById("loginLanguageSelect");if(ls)ls.value=hhhLanguage;const as=document.getElementById("languageSelect");if(as)as.value=hhhLanguage;const label=document.getElementById("loginLanguageLabel");if(label)label.textContent=hhhLanguage==="fr"?"Langue":hhhLanguage==="ar"?"اللغة":"Language";const appLabel=document.getElementById("appLanguageLabel");if(appLabel)appLabel.textContent=hhhLanguage==="fr"?"Langue":hhhLanguage==="ar"?"اللغة":"Language";applyHHHLang()}
const _render=render;render=function(){state.data.countries=[...(state.data.countries||[])].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));_render();addHHHLangUI()};
function hhhRoleCommittee(){const rn=state.role==="president"?"President":state.role==="deputy"?"Deputy President":state.role==="chair"?"Chair":null;return rn?state.data.staff.find(s=>s.role===rn)?.committee||null:null}
function canAccessCommitteeGrading(cid){if(["logistics","sg","training","advisory"].includes(state.role))return true;if(["president","deputy","chair"].includes(state.role))return hhhRoleCommittee()===cid;return false}
function hRubric(){return gradeRubrics[hhhLanguage]||gradeRubrics.en}function hId(v){return String(v).replace(/[^a-zA-Z0-9_-]/g,"_")}function hGrade(cid,country){return state.data.grades.find(g=>g.committee===cid&&g.country===country&&g.rubricLanguage===hhhLanguage)||{}}
function hTotal(g){return hRubric().reduce((s,c)=>s+c.criteria.reduce((x,[n,m])=>x+Math.max(0,Math.min(m,Number(g.criteria?.[n])||0)),0),0)}
function updateCountryGradeTotal(countryId){let t=0;hRubric().forEach(c=>c.criteria.forEach(([n,m])=>{const e=document.getElementById(`g_${hId(countryId)}_${hId(n)}`);t+=Math.max(0,Math.min(m,Number(e?.value)||0))}));const o=document.getElementById(`gt_${hId(countryId)}`);if(o)o.textContent=`${t}/100`}
function filterGradeCountries(q){q=String(q||"").toLowerCase().trim();document.querySelectorAll("#countryGradeList .country-grade-card").forEach(e=>e.style.display=(e.dataset.country+" "+e.dataset.delegate).includes(q)?"":"none")}
function saveCountryGrade(cid,countryId){if(!canAccessCommitteeGrading(cid))return alert("You do not have access to this committee's grading system.");let criteria={},total=0;for(const c of hRubric())for(const [n,m] of c.criteria){const e=document.getElementById(`g_${hId(countryId)}_${hId(n)}`),v=Number(e?.value||0);if(v<0||v>m)return alert(`Score must be between 0 and ${m}.`);criteria[n]=v;total+=v}const notes=document.getElementById(`gn_${hId(countryId)}`)?.value.trim()||"",i=state.data.grades.findIndex(g=>g.committee===cid&&g.country===countryId&&g.rubricLanguage===hhhLanguage),obj={id:i>=0?state.data.grades[i].id:uid(),committee:cid,country:countryId,rubricLanguage:hhhLanguage,criteria,total,score:total,notes,updated:Date.now()};if(i>=0)state.data.grades[i]=obj;else state.data.grades.push(obj);save();render()}
function deleteCountryGrade(cid,countryId){if(state.role!=="logistics")return alert("Only the Head of Logistics can delete grades without a grading password.");if(!confirm("Delete this country grade?"))return;state.data.grades=state.data.grades.filter(g=>!(g.committee===cid&&g.country===countryId&&g.rubricLanguage===hhhLanguage));save();render()}
function gradingRoom(){const c=committee(state.gradingCommittee);if(!c)return "";if(!canAccessCommitteeGrading(c.id))return `<div class="panel"><strong>Access denied.</strong></div>`;const countries=[...state.data.countries].filter(x=>(x.committees||[]).includes(c.id)).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""))),rubric=hRubric();const cards=countries.map(country=>{const d=state.data.delegates.find(x=>x.committee===c.id&&x.country===country.id),g=hGrade(c.id,country.id),cats=rubric.map(cat=>`<div class="grade-category"><div class="grade-category-head"><span>${esc(cat.name)}</span><span>/${cat.max}</span></div>${cat.criteria.map(([n,m])=>`<label class="grade-criterion"><span>${esc(n)} <small>/${m}</small></span><input id="g_${hId(country.id)}_${hId(n)}" type="number" min="0" max="${m}" step="0.5" value="${esc(g.criteria?.[n]??"")}" oninput="updateCountryGradeTotal('${country.id}')"></label>`).join("")}</div>`).join("");return `<details class="country-grade-card" data-country="${esc(country.name.toLowerCase())}" data-delegate="${esc((d?.name||"").toLowerCase())}"><summary><div class="country-grade-meta"><strong>${esc(country.name)}</strong>${d?`<span class="muted">${esc(d.name)}</span>`:""}</div><span class="country-grade-total" id="gt_${hId(country.id)}">${hTotal(g)}/100</span></summary><div>${cats}<div class="grade-note"><label class="form-label">${hhhLanguage==="ar"?"ملاحظات":"Notes"}</label><textarea id="gn_${hId(country.id)}" class="form-input" rows="3">${esc(g.notes||"")}</textarea></div><div class="grade-card-actions"><button class="primary" onclick="saveCountryGrade('${c.id}','${country.id}')">${hhhLanguage==="en"?"Save grade":hhhLanguage==="fr"?"Enregistrer la note":"حفظ العلامة"}</button>${state.role==="logistics"&&g.id?`<button class="row-btn danger" onclick="deleteCountryGrade('${c.id}','${country.id}')">${hhhLanguage==="en"?"Delete":hhhLanguage==="fr"?"Supprimer":"حذف"}</button>`:""}</div></div></details>`}).join("");const title=hhhLanguage==="en"?"Enter a committee grading room":hhhLanguage==="fr"?"Salle d’évaluation":"غرفة تقييم اللجنة",desc=hhhLanguage==="en"?"Country-based grading · English rubric":hhhLanguage==="fr"?"Évaluation par pays · barème français":"تقييم حسب الدولة · نموذج التقييم العربي",ph=hhhLanguage==="en"?"Search country or delegate…":hhhLanguage==="fr"?"Rechercher un pays ou un délégué…":"ابحث عن دولة أو مندوب…";return `<div class="grading-summary"><div><span class="eyebrow">${esc(c.name)} GRADING ROOM</span><h3>${esc(c.fullName||c.name)}</h3><p>${desc}</p></div><button class="secondary" onclick="state.gradingCommittee='';render()">${hhhLanguage==="en"?"Exit grading":hhhLanguage==="fr"?"Quitter l’évaluation":"الخروج من التقييم"}</button></div><div class="grading-tools"><div class="search">⌕ <input oninput="filterGradeCountries(this.value)" placeholder="${ph}"></div><span class="status in-session">${countries.length} ${hhhLanguage==="en"?"countries":hhhLanguage==="fr"?"pays":"دولة"}</span></div><div id="countryGradeList" class="country-grade-list">${cards||empty("No countries","Assign countries to this committee first.")}</div>`}
function enterGrading(){const id=document.getElementById("gradeCom")?.value,pass=document.getElementById("gradePass")?.value.trim()||"",c=committee(id);if(!c)return alert("Select a committee.");if(canAccessCommitteeGrading(id)||pass===c.gradingPassword){state.gradingCommittee=id;render()}else alert("You do not have access to this committee's grading system.")}
const _oldGrading=pages.grading;pages.grading=()=>{const allowed=state.data.committees.filter(c=>canAccessCommitteeGrading(c.id)),lab=hhhLanguage==="en"?"Committee":hhhLanguage==="fr"?"Comité":"اللجنة",ph=hhhLanguage==="en"?"Select committee":hhhLanguage==="fr"?"Sélectionner un comité":"اختر اللجنة",pw=hhhLanguage==="en"?"Committee grading password":hhhLanguage==="fr"?"Mot de passe d’évaluation":"كلمة مرور تقييم اللجنة",btn=hhhLanguage==="en"?"Enter grading system":hhhLanguage==="fr"?"Accéder au système d’évaluation":"الدخول إلى نظام التقييم";if(state.gradingCommittee)return gradingRoom();return `<div class="grading-summary"><div><span class="eyebrow">COMMITTEE-GATED GRADING</span><h3>${hhhLanguage==="en"?"Enter a committee grading room":hhhLanguage==="fr"?"Accéder à la salle d’évaluation":"الدخول إلى نظام تقييم اللجنة"}</h3><p>${hhhLanguage==="en"?"The selected website language controls the grading rubric.":hhhLanguage==="fr"?"La langue du site contrôle le barème.":"لغة الموقع المختارة تتحكم في نموذج التقييم."}</p></div></div><div class="panel"><div class="modal-body">${selectField(lab,"gradeCom",`<option value="">${ph}</option>`+allowed.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""))}${["logistics","sg","training","advisory"].includes(state.role)?"":formField(pw,"gradePass",`type="password" placeholder="${pw}"`)}<button class="primary full" onclick="enterGrading()">${btn}</button></div></div>`};
setTimeout(addHHHLangUI,0);
</script>
