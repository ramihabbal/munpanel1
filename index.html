function cloneData(x){return structuredClone(x||{});}
function sameJSON(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch{return false}}
function mergeArrayThreeWay(base, local, remote){
  const B=Array.isArray(base)?base:[], L=Array.isArray(local)?local:[], R=Array.isArray(remote)?remote:[];
  const bm=new Map(B.filter(x=>x&&x.id!=null).map(x=>[String(x.id),x]));
  const lm=new Map(L.filter(x=>x&&x.id!=null).map(x=>[String(x.id),x]));
  const rm=new Map(R.filter(x=>x&&x.id!=null).map(x=>[String(x.id),x]));
  const keys=new Set([...bm.keys(),...lm.keys(),...rm.keys()]);
  const out=[];
  for(const k of keys){
    const b=bm.get(k), l=lm.get(k), r=rm.get(k);
    const lc=!sameJSON(l,b), rc=!sameJSON(r,b);
    if(!l && !r) continue;
    if(!l && b && !rc) continue; // local deleted, remote unchanged
    if(!r && b && !lc){ out.push(l); continue; } // remote deleted, local changed
    if(lc && !rc){ out.push(l); continue; }
    if(rc && !lc){ out.push(r); continue; }
    if(lc && rc){ out.push(l); continue; } // deterministic: local edit wins on same record
    out.push(l||r);
  }
  return out;
}
function mergeConferenceState(base,local,remote){
  const out={...cloneData(remote)};
  const arrayKeys=['committees','countries','staff','delegates','resolutions','resources','grades','logisticsRequests','notifications'];
  for(const k of arrayKeys) out[k]=mergeArrayThreeWay(base?.[k],local?.[k],remote?.[k]);
  const bScreen=base?.screen||{}, lScreen=local?.screen||{}, rScreen=remote?.screen||{};
  out.screen=sameJSON(lScreen,bScreen)?cloneData(rScreen):cloneData(lScreen);
  for(const k of new Set([...Object.keys(remote||{}),...Object.keys(local||{})])){
    if(arrayKeys.includes(k)||k==='screen') continue;
    const lv=local?.[k], bv=base?.[k], rv=remote?.[k];
    out[k]=sameJSON(lv,bv)?cloneData(rv):cloneData(lv);
  }
  return out;
}
async function pullRemoteState(){
  try{
    const {data,error}=await supabaseClient.from("conference_state").select("data").eq("id","main").maybeSingle();
    if(error) throw error;
    remoteReady=true; remoteError="";
    if(data?.data && Object.keys(data.data).length){
      state.data={...structuredClone(defaults),...data.data};
      lastRemoteSnapshot=cloneData(state.data);
      localDirty=false;
      saveLocalOnly();
      if(state.role) render();
    } else {
      lastRemoteSnapshot=cloneData(state.data);
      await pushRemoteState();
    }
  }catch(e){
    remoteReady=false; remoteError=e?.message||String(e);
    console.error("Supabase connection failed:",e);
    renderRemoteStatus();
  }
}
async function ensureRemoteReady(){
  if(remoteReady)return true;
  try{
    const {error}=await supabaseClient.from("conference_state").select("id").eq("id","main").maybeSingle();
    if(error)throw error;
    remoteReady=true; remoteError=""; return true;
  }catch(e){
    remoteReady=false; remoteError=e?.message||String(e);
    alert("Shared storage is not connected yet. Supabase said: "+remoteError+"\n\nRun SUPABASE_SETUP.sql in Supabase SQL Editor, then reload the site.");
    return false;
  }
}
function renderRemoteStatus(){
  const el=document.getElementById("remoteStatus");
  if(el) el.textContent=remoteReady?"Shared storage connected":"Shared storage not connected";
}
function saveLocalOnly(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data))}catch(e){}}
async function pushRemoteState(){
  if(!remoteReady)return;
  try{
    const {data,error}=await supabaseClient.from("conference_state").select("data").eq("id","main").maybeSingle();
    if(error)throw error;
    const remote=data?.data&&Object.keys(data.data).length?data.data:defaults;
    const merged=mergeConferenceState(lastRemoteSnapshot||remote,state.data,remote);
    state.data={...structuredClone(defaults),...merged};
    const {error:upsertError}=await supabaseClient.from("conference_state").upsert({id:"main",data:state.data,updated_at:new Date().toISOString()},{onConflict:"id"});
    if(upsertError)throw upsertError;
    lastRemoteSnapshot=cloneData(state.data);
    localDirty=false;
    saveLocalOnly();
  }catch(e){console.warn("Remote save failed",e)}
}
function scheduleRemoteSave(){
  localDirty=true;
  clearTimeout(remoteSaveTimer);
  remoteSaveTimer=setTimeout(pushRemoteState,250);
}
function isGradingLocked(){
  return state.page==="grading";
}
function startRemoteSync(){
  try{
    supabaseClient.channel("hhhsmUN-conference-state")
      .on("postgres_changes",{event:"*",schema:"public",table:"conference_state",filter:"id=eq.main"},payload=>{
        const incoming=payload?.new?.data;
        if(!incoming || localDirty || isGradingLocked())return;
        state.data={...structuredClone(defaults),...incoming};
        lastRemoteSnapshot=cloneData(state.data);
        saveLocalOnly();
        // Background realtime updates must not re-render the Chairing Screen.
        // The explicit Update button controls publication to the connected screen.
        if(state.role && state.page!=="screen") render();
      }).subscribe();
  }catch(e){console.warn("Realtime subscription unavailable; polling will be used.",e)}
  setInterval(async()=>{
    if(!remoteReady || localDirty || isGradingLocked())return;
    try{
      const {data,error}=await supabaseClient.from("conference_state").select("data,updated_at").eq("id","main").maybeSingle();
      if(error||!data?.data)return;
      if(!sameJSON(data.data,lastRemoteSnapshot)){
        // Do not replace the Chairing Screen form from background polling.
        // Its text/select changes are published only by "Update connected screen".
        if(state.page==="screen") return;
        state.data={...structuredClone(defaults),...data.data};
        lastRemoteSnapshot=cloneData(state.data);
        saveLocalOnly();
        if(state.role) render();
      }
    }catch(e){console.warn("Remote sync poll failed",e)}
  },5000);
}

};

async function downloadStorageFile(path,name){
  if(!path)return alert("This file is not available.");
  if(!(await ensureRemoteReady()))return;
  try{
    const {data,error}=await supabaseClient.storage.from("conference-files").download(path);
    if(error)throw error;
    const url=URL.createObjectURL(data),a=document.createElement("a");
    a.href=url;a.download=name||path.split("/").pop()||"download";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){console.error(e);alert("Unable to download the file.\n\n"+(e?.message||e));}
}

logisticsRequests:()=>{const all=state.data.logisticsRequests||[];const canSubmit=["president","chair"].includes(state.role);const canManage=state.role==="logistics";const mine=state.data.staff.find(s=>s.role==="Chair"&&s.name===window.roles.chair.name);let visible=all;if(state.role==="chair")visible=all.filter(r=>r.committee===mine?.committee);return `<div class="toolbar">${canSubmit?`<button class="primary" onclick="openLogisticsRequest()">+ New logistics request</button>`:""}${canManage?`<button class="secondary" onclick="markAllLogisticsRead()">Mark notifications read</button>`:""}</div><div class="metric-grid">${metric("Requests",visible.length,"Submitted")}${metric("Pending",visible.filter(r=>r.status==="Pending").length,"Awaiting fulfillment")}${metric("Reusable",visible.filter(r=>r.reusable).length,"Return required")}${metric("Committees",new Set(visible.map(r=>r.committee)).size,"Requesting")}</div><div class="panel"><div class="panel-head"><div><h3>${canManage?"Logistics request inbox":"Committee logistics requests"}</h3><p>${canManage?"Requests submitted by Presidents and Dais appear here with their committee, item, amount and colour.":"Submit materials needed for committee decoration and setup."}</p></div></div>${visible.length?`<div class="logistics-request-list">${visible.slice().sort((a,b)=>b.createdAt-a.createdAt).map(r=>`<div class="logistics-request"><div><strong>${esc(committee(r.committee)?.name||"Unknown committee")}</strong><span>${esc(r.item)} · ${r.amount}${r.color?` · ${esc(r.color)}`:""}${r.reusable?` · <b>Reusable — return required</b>`:""}</span><small>${new Date(r.createdAt).toLocaleString()} · ${esc(r.requestedBy||"Committee")}</small></div><span class="status ${r.status==="Fulfilled"?"in-session":"break"}">${r.status}</span>${canManage?`<button class="row-btn" onclick="fulfillLogisticsRequest('${r.id}')">${r.status==="Fulfilled"?"Mark pending":"Mark fulfilled"}</button>`:""}</div>`).join("")}</div>`:empty("No logistics requests","No requests have been submitted yet.")}</div><div class="panel"><div class="panel-head"><div><h3>Materials terms</h3><p>Reusable materials such as scissors and staplers must be returned. Lost or unreturned reusable materials are subject to replacement costs under Secretariat policy.</p></div></div></div>`},

function openCommittee(id=""){const x=committee(id)||{};modal(id?"Edit committee":"Add committee",`${formField("Committee abbreviation","fName",`value="${esc(x.name||"")}" placeholder="UNODC"`)}${formField("Official committee name","fFull",`value="${esc(x.fullName||"")}"`)}${formField("Room (optional)","fRoom",`value="${esc(x.room||"")}"`)}${formField("Committee type (optional)","fType",`value="${esc(x.type||"")}" placeholder="General Assembly, Crisis, Specialized..."`)}<label class="form-label">Description (optional)</label><textarea id="fDescription" class="form-input" rows="3" placeholder="Brief description">${esc(x.description||"")}</textarea><button class="primary full" onclick="saveCommittee('${id}')">Save committee</button>`)}
function saveCommittee(id){const name=document.getElementById("fName").value.trim(),fullName=document.getElementById("fFull").value.trim(),room=document.getElementById("fRoom").value.trim(),type=document.getElementById("fType").value.trim(),description=document.getElementById("fDescription").value.trim();if(!name)return alert("Committee abbreviation is required.");const duplicate=state.data.committees.find(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==id);if(duplicate)return alert("A committee with that abbreviation already exists.");const obj={id:id||uid(),name,fullName,room,type,description,gradingPassword:id?(committee(id)?.gradingPassword||generateCommitteePassword()):generateCommitteePassword()};const i=state.data.committees.findIndex(c=>c.id===id);i>=0?state.data.committees[i]=obj:state.data.committees.push(obj);save();closeModal();render()}
function openCountry(id=""){const x=state.data.countries.find(x=>x.id===id)||{committees:[]};modal(id?"Edit country":"Add country",`${formField("Country name","fCountry",`value="${esc(x.name||"")}"`)}<label class="form-label">Committees where this country is available</label><div class="check-grid">${state.data.committees.length?state.data.committees.map(c=>`<label><input type="checkbox" name="fCom" value="${c.id}" ${(x.committees||[]).includes(c.id)?"checked":""}> ${esc(c.name)}</label>`).join(""):"<span class='muted'>Create committees first.</span>"}</div><button class="primary full" onclick="saveCountry('${id}')">Save country</button>`)}
function saveCountry(id){const name=document.getElementById("fCountry").value.trim();if(!name)return alert("Country name is required.");const committees=[...document.querySelectorAll('input[name="fCom"]:checked')].map(x=>x.value),obj={id:id||uid(),name,committees};const i=state.data.countries.findIndex(x=>x.id===id);i>=0?state.data.countries[i]=obj:state.data.countries.push(obj);save();closeModal();render()}
function openStaff(id=""){const x=state.data.staff.find(x=>x.id===id)||{};const rolesList=["President","Deputy President","Secretary-General","Head of Logistics","Head of Finance","Head of Training","Head of Rapporteurs","Chair"];modal(id?"Edit staff member":"Add staff member",`${formField("Full name","fStaff",`value="${esc(x.name||"")}"`)}${selectField("Role","fRole",rolesList.map(r=>`<option ${x.role===r?"selected":""}>${r}</option>`).join(""))}${selectField("Committee","fStaffCom",`<option value="">Conference-wide</option>`+state.data.committees.map(c=>`<option value="${c.id}" ${x.committee===c.id?"selected":""}>${esc(c.name)}</option>`).join(""))}<button class="primary full" onclick="saveStaff('${id}')">Save staff member</button>`)}
function saveStaff(id){const name=document.getElementById("fStaff").value.trim(),role=document.getElementById("fRole").value,com=document.getElementById("fStaffCom").value;if(!name)return alert("Name is required.");if(["President","Deputy President","Secretary-General","Head of Logistics","Head of Finance","Head of Training","Head of Rapporteurs"].includes(role))com="";if(["President","Deputy President","Chair"].includes(role)&&com){const occupied=state.data.staff.find(s=>s.id!==id&&s.committee===com&&s.role===role);if(occupied)return alert(`This committee already has a ${role}.`)}const obj={id:id||uid(),name,role,committee:com};const i=state.data.staff.findIndex(x=>x.id===id);i>=0?state.data.staff[i]=obj:state.data.staff.push(obj);save();closeModal();render()}

function countriesPanel(){const selected=state.countryCommittee||state.data.committees[0]?.id||"";const c=committee(selected);const countries=state.data.countries.filter(x=>(x.committees||[]).includes(selected));return `<div class="toolbar"><div class="field-inline"><label>Committee</label><select class="committee-selector" onchange="state.countryCommittee=this.value;render()">${state.data.committees.map(x=>`<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>${canManage()?`<button class="primary" onclick="openCountry()">+ Add country</button>`:""}</div><div class="panel"><div class="panel-head"><div><h3>${esc(c?.name||"Countries")}</h3><p>Select the attendance status for each country. Changes save automatically.</p></div><span class="status in-session">${countries.length} countries</span></div><div class="country-list"><div class="country-attendance-head"><strong>Country</strong><strong>Attendance</strong></div>${countries.length?countries.map(country=>{const att=(country.attendance||{})[selected]||"";return `<div class="country-panel-row"><strong>${esc(country.name)}</strong><select class="attendance-select" onchange="setCountryAttendance('${country.id}','${selected}',this.value)"><option value="">Select attendance</option><option value="Present" ${att==="Present"?"selected":""}>Present</option><option value="Present and Voting" ${att==="Present and Voting"?"selected":""}>Present and Voting</option><option value="Absent" ${att==="Absent"?"selected":""}>Absent</option></select></div>`}).join(""):`<div class="empty-state"><strong>No countries assigned to this committee yet.</strong><p>Add countries through the committee management panel.</p></div>`}</div></div><div class="panel"><div class="panel-head"><div><h3>Attendance summary</h3><p>${esc(c?.name||"")}</p></div></div><div class="attendance-summary">${["Present","Present and Voting","Absent"].map(a=>{const n=countries.filter(x=>((x.attendance||{})[selected]|| function saveLogisticsRequest(){
 const mine=state.data.staff.find(s=>s.role==="Chair"&&s.name===window.roles.chair.name);
 let committeeId=state.role==="president"?(document.getElementById("lrCommittee")?.value||""):(mine?.committee||"");
 if(!committeeId)return alert("Please select a committee.");
 if(!["chair","president"].includes(state.role))return alert("You do not have permission to submit a committee logistics request.");
 if(!document.getElementById("lrAgree").checked)return alert("You must accept the materials receipt and return terms.");
 const requests=[];
 document.querySelectorAll(".lrItemCheck:checked").forEach((check,i)=>{
   const amount=Number(document.querySelector(`.lrAmount[data-for="${i}"]`).value);
   const color=document.querySelector(`.lrColor[data-for="${i}"]`).value.trim();
   if(!amount||amount<1) return;
   requests.push({item:check.dataset.item,amount,color,reusable:check.dataset.reusable==="true"});
 });
 if(document.getElementById("lrOtherCheck").checked){
   const item=document.getElementById("lrOtherItem").value.trim();
   const amount=Number(document.getElementById("lrOtherAmount").value);
   const color=document.getElementById("lrOtherColor").value.trim();
   const reusable=document.getElementById("lrOtherReusable").checked;
   if(!item||!amount||amount<1)return alert("Complete the Other item name and amount.");
   requests.push({item,amount,color,reusable});
 }
 if(!requests.length)return alert("Select at least one material.");
 state.data.logisticsRequests=state.data.logisticsRequests||[];
 state.data.notifications=state.data.notifications||[];
 const now=Date.now();
 const groupId=uid();
 requests.forEach(r=>{
   const req={id:uid(),groupId,committee:committeeId,item:r.item,amount:r.amount,color:r.color,reusable:r.reusable,status:"Pending",requestedBy:window.roles[state.role]?.name||"Committee Dais",requestedByRole:state.role,createdAt:now};
   state.data.logisticsRequests.push(req);
 });
 state.data.notifications.push({
   id:uid(),type:"logistics",groupId,committee:committeeId,
   message:`New supply request: ${requests.map(r=>`${r.amount} × ${r.item}${r.color?" · "+r.color:""}`).join(", ")}`,
   createdAt:now,read:false
 });
 save();closeModal();go("logisticsRequests");
 alert("Your committee's logistics request has been sent to the Head of Logistics.");
}

function openResource(){modal("Upload conference resource",`${formField("Title","resTitle",`placeholder="e.g. UNODC Background Guide"`)}${selectField("Committee (optional)","resCom",`<option value="">Conference-wide</option>`+state.data.committees.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""))}<label class="form-label">Description</label><textarea id="resDesc" class="form-input" rows="4" placeholder="What is this file for?"></textarea><label class="form-label">File</label><input id="resFile" class="form-input" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx" onchange="showResourceFile(this)"><div id="resFileInfo" class="muted" style="margin-top:7px">PDF, DOC, DOCX, PPT or PPTX · maximum 30 MB</div><button class="primary full" onclick="saveResource()">Upload resource</button>`)}
function showResourceFile(input){const f=input.files?.[0],box=document.getElementById("resFileInfo");if(!box)return;if(!f){box.textContent="No file selected.";return}box.textContent=`${f.name} · ${(f.size/1024/1024).toFixed(2)} MB`;if(f.size>30*1024*1024){box.textContent="File is too large. Maximum size is 30 MB.";input.value=""}}
async function saveResource(){const title=document.getElementById("resTitle").value.trim(),committeeId=document.getElementById("resCom").value,description=document.getElementById("resDesc").value.trim(),file=document.getElementById("resFile").files?.[0];if(!title||!file)return alert("Title and file are required.");if(file.size>30*1024*1024)return alert("The resource must be 30 MB or smaller.");const ext=file.name.toLowerCase().split(".").pop();if(!["pdf","doc","docx","ppt","pptx"].includes(ext))return alert("Please upload a PDF, DOC, DOCX, PPT or PPTX file.");const id=uid();showUploadLoading("resource");try{const filePath=await storeResourceFile(id,file);state.data.resources=state.data.resources||[];state.data.resources.push({id,title,committee:committeeId,description,fileName:file.name,fileType:file.type,fileSize:file.size,filePath:filePath,uploadedBy:state.role,uploadedAt:Date.now()});save();hideUploadLoading();closeModal();render();alert("Resource uploaded successfully.")}catch(e){console.error(e);hideUploadLoading();alert("The resource could not be uploaded to shared storage.\n\n"+(e?.message||e));}}
async function removeResource(id){
  if(!isStaff()||!confirm("Remove this resource?"))return;
  const r=(state.data.resources||[]).find(x=>x.id===id);
  if(r?.filePath && await ensureRemoteReady()) await supabaseClient.storage.from("conference-files").remove([r.filePath]);
  state.data.resources=(state.data.resources||[]).filter(x=>x.id!==id);
  save();render();
}
function removeRecord(type,id){if(!confirm("Delete this record?"))return;state.data[type]=state.data[type].filter(x=>x.id!==id);if(type==="committees"){state.data.countries.forEach(c=>c.committees=(c.committees||[]).filter(x=>x!==id));state.data.staff=state.data.staff.filter(s=>s.committee!==id);state.data.delegates=state.data.delegates.filter(d=>d.committee!==id);state.data.resolutions=state.data.resolutions.filter(r=>r.committee!==id);state.data.grades=state.data.grades.filter(g=>g.committee!==id);state.data.logisticsRequests=(state.data.logisticsRequests||[]).filter(r=>r.committee!==id);state.data.resources=(state.data.resources||[]).filter(r=>r.committee!==id);if(state.data.screen?.committeeId===id)state.data.screen={...defaults.screen};}if(type==="countries")state.data.delegates=state.data.delegates.filter(d=>d.country!==id);save();render()}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)],{type:"application/json"}));a.download="hhhsmUN-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state.data={...defaults,...JSON.parse(r.result)};save();render();alert("Backup imported.")}catch{alert("Invalid backup file.")}};r.readAsText(file)}
function clearData(){if(confirm("Clear all conference data saved in this browser?")){state.data=structuredClone(defaults);save();state.gradingCommittee="";render()}}
// Delegate portal: accessible from the delegate side when the role is later connected to real accounts.

function openDelegateResolution(){openResolution()}

function applyHHHLang(){
  const isArabic=hhhLanguage==="ar";
  document.documentElement.lang=hhhLanguage;
  document.documentElement.dir=isArabic?"rtl":"ltr";
  document.body.dir=isArabic?"rtl":"ltr";
  const map=HHH_PHRASES[hhhLanguage]||{};
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    if(!HHH_TEXT_ORIGINAL.has(node)) HHH_TEXT_ORIGINAL.set(node,node.nodeValue);
    const original=HHH_TEXT_ORIGINAL.get(node);
    if(!original || !original.trim()) return;
    if(hhhLanguage==="en"){ node.nodeValue=original; return; }
    let value=original;
    Object.entries(map).sort((a,b)=>b[0].length-a[0].length).forEach(([from,to])=>{ value=value.split(from).join(to); });
    node.nodeValue=value;
  });
  const roleLabels={
    en:{president:"President",deputy:"Deputy President",sg:"Secretary-General",logistics:"Head of Logistics",finance:"Head of Finance",training:"Head of Training",rapporteur:"Head of Rapporteurs",advisory:"Advisory Panel",chair:"Chair",delegate:"Delegate"},
    fr:{president:"Président",deputy:"Vice-président",sg:"Secrétaire général",logistics:"Responsable de la logistique",finance:"Responsable des finances",training:"Responsable de la formation",rapporteur:"Responsable des rapporteurs",advisory:"Conseil consultatif",chair:"Président de comité",delegate:"Délégué"},
    ar:{president:"الرئيس",deputy:"نائب الرئيس",sg:"الأمين العام",logistics:"رئيس قسم اللوجستيات",finance:"رئيس قسم الشؤون المالية",training:"رئيس قسم التدريب",rapporteur:"رئيس قسم المقررين",advisory:"المجلس الاستشاري",chair:"رئيس اللجنة",delegate:"مندوب"}
  };
  const roleSelect=document.getElementById("accountType");
  if(roleSelect){
    const selected=roleSelect.value;
    Array.from(roleSelect.options).forEach(opt=>{
      opt.textContent=roleLabels[hhhLanguage]?.[opt.value]||opt.textContent;
    });
    roleSelect.value=selected;
  }
  document.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(el=>{
    if(!el.dataset.hhhPlaceholderOriginal) el.dataset.hhhPlaceholderOriginal=el.getAttribute("placeholder")||"";
    const original=el.dataset.hhhPlaceholderOriginal;
    el.setAttribute("placeholder",hhhLanguage==="en"?original:(map[original]||original));
  });
}
function setHHHLang(v){
  const next=HHH_LANGS[v]?v:"en";
  if(next===hhhLanguage){
    addHHHLangUI();
    return;
  }
  hhhLanguage=next;
  localStorage.setItem(HHH_LANG_KEY,hhhLanguage);
  // Reload the document after a language change. This prevents translated text
  // from being translated a second time and guarantees a clean LTR/RTL switch.
  window.location.reload();
}
function addHHHLangUI(){
  const loginSelect=document.getElementById("loginLanguageSelect");
  const appSelect=document.getElementById("languageSelect");
  if(loginSelect) loginSelect.value=hhhLanguage;
  if(appSelect) appSelect.value=hhhLanguage;
  const label= document.getElementById("loginLanguageLabel");
  const appLabel=document.getElementById("appLanguageLabel");
  if(label) label.textContent=hhhLanguage==="fr"?"Langue":hhhLanguage==="ar"?"اللغة":"Language";
  if(appLabel) appLabel.textContent=hhhLanguage==="fr"?"Langue":hhhLanguage==="ar"?"اللغة":"Language";
  applyHHHLang();
}

function hhhRoleName(){return state.role==="president"?"President":state.role==="deputy"?"Deputy President":state.role==="chair"?"Chair":null}
function hhhRoleCommittees(){
  const rn=hhhRoleName();
  if(!rn)return [];
  const assigned=[...new Set((state.data.staff||[]).filter(s=>s.role===rn&&s.committee).map(s=>s.committee))];
  // If the conference has exactly one committee and this Dais role has not
  // been assigned yet, that committee is unambiguous and should still appear
  // in the committee/password selector. Once multiple committees exist, the
  // normal staff assignment controls which committees the role can access.
  if(!assigned.length && (state.data.committees||[]).length===1){
    return [state.data.committees[0].id];
  }
  return assigned;
}
function hhhRoleCommittee(){return hhhRoleCommittees()[0]||null}
function canAccessCommitteeGrading(cid){
  if(["logistics","sg","training","advisory"].includes(state.role))return true;
  if(["president","deputy","chair"].includes(state.role))return hhhRoleCommittees().includes(cid);
  return false;
}
function hRubric(){return gradeRubrics[hhhLanguage]||gradeRubrics.en}
function hId(v){return String(v).replace(/[^a-zA-Z0-9_-]/g,"_")}
function criterionKey(ci,ri){return `${ci}_${ri}`}
function criterionValue(g,ci,ri,name){const key=criterionKey(ci,ri);if(g?.criteria&&Object.prototype.hasOwnProperty.call(g.criteria,key))return g.criteria[key];return g?.criteria?.[name]??""}
function hGrade(cid,country){return state.data.grades.find(g=>g.committee===cid&&g.country===country&&g.rubricLanguage===hhhLanguage)||{}}
function hTotal(g){return hRubric().reduce((s,c,ci)=>s+c.criteria.reduce((x,[n,m],ri)=>x+Math.max(0,Math.min(m,Number(criterionValue(g,ci,ri,n))||0)),0),0)}
let openGradeCountries=new Set(); function setGradeCountryOpen(countryId,isOpen){if(isOpen)openGradeCountries.add(countryId);else openGradeCountries.delete(countryId)} function updateCountryGradeTotal(countryId){let t=0;hRubric().forEach((c,ci)=>c.criteria.forEach(([n,m],ri)=>{const e=document.getElementById(`g_${hId(countryId)}_${criterionKey(ci,ri)}`);t+=Math.max(0,Math.min(m,Number(e?.value)||0))}));const o=document.getElementById(`gt_${hId(countryId)}`);if(o)o.textContent=`${t}/100`}
function filterGradeCountries(q){q=String(q||"").toLowerCase().trim();document.querySelectorAll("#countryGradeList .country-grade-card").forEach(e=>e.style.display=(e.dataset.country+" "+e.dataset.delegate).includes(q)?"":"none")}
async function saveCountryGrade(cid,countryId){if(!canAccessCommitteeGrading(cid))return alert("You do not have access to this committee's grading system.");let criteria={},total=0;for(let ci=0;ci<hRubric().length;ci++){const c=hRubric()[ci];for(let ri=0;ri<c.criteria.length;ri++){const [n,m]=c.criteria[ri];const e=document.getElementById(`g_${hId(countryId)}_${criterionKey(ci,ri)}`),v=Number(e?.value||0);if(v<0||v>m)return alert(`Score must be between 0 and ${m}.`);criteria[criterionKey(ci,ri)]=v;total+=v;}}
  const notes=document.getElementById(`gn_${hId(countryId)}`)?.value.trim()||"",i=state.data.grades.findIndex(g=>g.committee===cid&&g.country===countryId&&g.rubricLanguage===hhhLanguage),obj={id:i>=0?state.data.grades[i].id:uid(),schema:2,committee:cid,country:countryId,rubricLanguage:hhhLanguage,criteria,total,score:total,notes,updated:Date.now()};if(i>=0)state.data.grades[i]=obj;else state.data.grades.push(obj);saveLocalOnly();localDirty=true;try{await ensureRemoteReady();if(remoteReady){await pushRemoteState();}}catch(e){console.warn("Grade save failed",e);alert("The grade could not be saved to shared storage. Please try Save grade again.");return}render()}
function deleteCountryGrade(cid,countryId){if(state.role!=="logistics")return alert("Only the Head of Logistics can delete grades without a grading password.");if(!confirm("Delete this country grade?"))return;state.data.grades=state.data.grades.filter(g=>!(g.committee===cid&&g.country===countryId&&g.rubricLanguage===hhhLanguage));clearGradeDraft(cid,countryId,hhhLanguage);save();render()}
function gradingRoom(){
  const c=committee(state.gradingCommittee);
  if(!c)return "";
  if(!canAccessCommitteeGrading(c.id))return `<div class="panel"><strong>${hhhLanguage==="ar"?"لا تملك صلاحية الوصول إلى نظام تقييم هذه اللجنة.":hhhLanguage==="fr"?"Vous n’avez pas accès au système d’évaluation de ce comité.":"You do not have access to this committee's grading system."}</strong></div>`;
  const countries=[...state.data.countries].filter(x=>(x.committees||[]).includes(c.id)).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
  const rubric=hRubric();
  const cards=countries.map(country=>{
    const d=state.data.delegates.find(x=>x.committee===c.id&&x.country===country.id);
    const g=hGrade(c.id,country.id);
    const cats=rubric.map((cat,ci)=>`<div class="grade-category">
      <div class="grade-category-head"><span>${esc(cat.name)}</span><span>/${cat.max}</span></div>
      ${cat.criteria.map(([n,m],ri)=>`<label class="grade-criterion">
        <span>${esc(n)} <small>/${m}</small></span>
        <input id="g_${hId(country.id)}_${criterionKey(ci,ri)}" type="number" min="0" max="${m}" step="0.5" value="${esc(criterionValue(g,ci,ri,n))}" oninput="updateCountryGradeTotal('${country.id}')">
      </label>`).join("")}
    </div>`).join("");
    const saveText=hhhLanguage==="en"?"Save grade":hhhLanguage==="fr"?"Enregistrer la note":"حفظ العلامة";
    const deleteText=hhhLanguage==="en"?"Delete":hhhLanguage==="fr"?"Supprimer":"حذف";
    return `<details class="country-grade-card" dir="${hhhLanguage==='ar'?'rtl':'ltr'}" data-country="${esc(country.name.toLowerCase())}" data-delegate="${esc((d?.name||"").toLowerCase())}" ${openGradeCountries.has(country.id)?"open":""} ontoggle="setGradeCountryOpen('${country.id}',this.open)">
      <summary><div class="country-grade-meta"><strong>${esc(country.name)}</strong>${d?`<span class="muted">${esc(d.name)}</span>`:""}</div><span class="country-grade-total" id="gt_${hId(country.id)}">${hTotal(g)}/100</span></summary>
      <div class="country-grade-body">${cats}<div class="grade-note"><label class="form-label">${hhhLanguage==="ar"?"ملاحظات":hhhLanguage==="fr"?"Remarques":"Notes"}</label><textarea id="gn_${hId(country.id)}" class="form-input" rows="3">${esc(g.notes||"")}</textarea></div><div class="grade-card-actions"><button class="primary" onclick="saveCountryGrade('${c.id}','${country.id}')">${saveText}</button>${state.role==="logistics"&&g.id?`<button class="row-btn danger" onclick="deleteCountryGrade('${c.id}','${country.id}')">${deleteText}</button>`:""}</div></div>
    </details>`;
  }).join("");
  const desc=hhhLanguage==="en"?"Country-based grading · English rubric":hhhLanguage==="fr"?"Évaluation par pays · barème français":"تقييم حسب الدولة · نموذج التقييم العربي";
  const ph=hhhLanguage==="en"?"Search country or delegate…":hhhLanguage==="fr"?"Rechercher un pays ou un délégué…":"ابحث عن دولة أو مندوب…";
  const exit=hhhLanguage==="en"?"Exit grading":hhhLanguage==="fr"?"Quitter l’évaluation":"الخروج من التقييم";
  const countLabel=hhhLanguage==="en"?"countries":hhhLanguage==="fr"?"pays":"دولة";
  const emptyText=hhhLanguage==="en"?"Assign countries to this committee first.":hhhLanguage==="fr"?"Ajoutez d’abord des pays à ce comité.":"يرجى إضافة الدول إلى هذه اللجنة أولًا.";
  return `<div class="grading-room" dir="${hhhLanguage==='ar'?'rtl':'ltr'}"><div class="grading-summary"><div><span class="eyebrow">${esc(c.name)} GRADING ROOM</span><h3>${esc(c.fullName||c.name)}</h3><p>${desc}</p></div><button class="secondary" onclick="state.gradingCommittee='';render()">${exit}</button></div><div class="grading-tools"><div class="search">⌕ <input oninput="filterGradeCountries(this.value)" placeholder="${ph}"></div><span class="status in-session">${countries.length} ${countLabel}</span></div><div id="countryGradeList" class="country-grade-list">${cards||`<div class="empty"><strong>${hhhLanguage==="ar"?"لا توجد دول":hhhLanguage==="fr"?"Aucun pays":"No countries"}</strong><p>${emptyText}</p></div>`}</div></div>`;
}
function enterGrading(){
  const id=document.getElementById("gradeCom")?.value;
  const pass=document.getElementById("gradePass")?.value.trim()||"";
  const c=committee(id);
  if(!c)return alert("Select a committee.");
  if(!canAccessCommitteeGrading(id))return alert("You do not have access to this committee's grading system.");
  const unrestricted=["logistics","sg","training","advisory"].includes(state.role);
  if(!unrestricted && pass!==c.gradingPassword)return alert("Incorrect committee grading password.");
  state.gradingCommittee=id;
  render();
}
const _oldGrading=pages.grading;pages.grading=()=>{const allowed=state.data.committees.filter(c=>canAccessCommitteeGrading(c.id)),lab=hhhLanguage==="en"?"Committee":hhhLanguage==="fr"?"Comité":"اللجنة",ph=hhhLanguage==="en"?"Select committee":hhhLanguage==="fr"?"Sélectionner un comité":"اختر اللجنة",pw=hhhLanguage==="en"?"Committee grading password":hhhLanguage==="fr"?"Mot de passe d’évaluation":"كلمة مرور تقييم اللجنة",btn=hhhLanguage==="en"?"Enter grading system":hhhLanguage==="fr"?"Accéder au système d’évaluation":"الدخول إلى نظام التقييم";if(state.gradingCommittee)return gradingRoom();return `<div class="grading-summary"><div><span class="eyebrow">COMMITTEE-GATED GRADING</span><h3>${hhhLanguage==="en"?"Enter a committee grading room":hhhLanguage==="fr"?"Accéder à la salle d’évaluation":"الدخول إلى نظام تقييم اللجنة"}</h3><p>${hhhLanguage==="en"?"The selected website language controls the grading rubric.":hhhLanguage==="fr"?"La langue du site contrôle le barème.":"لغة الموقع المختارة تتحكم في نموذج التقييم."}</p></div></div><div class="panel"><div class="modal-body">${selectField(lab,"gradeCom",`<option value="">${ph}</option>`+allowed.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(""))}${["logistics","sg","training","advisory"].includes(state.role)?"":formField(pw,"gradePass",`type="password" placeholder="${pw}"`)}<button class="primary full" onclick="enterGrading()">${btn}</button></div></div>`};
window.addEventListener("DOMContentLoaded",()=>{
  addHHHLangUI();
});
</script>
